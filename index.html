<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>For My Girl 🤍</title>

<!--
  CARA MENGGANTI FOTO:
  Ada 3 slot foto di bagian galeri "my girl".
  Cari komentar FOTO 1, FOTO 2, dst, lalu ganti src="..." dengan
  foto kalian sendiri (taruh file sejajar file ini,
  misal src="foto/pacarku.jpg").

  CARA MENAMBAHKAN VIDEO:
  Taruh file video kamu (misal: video.mp4, video.mov, atau video.webm)
  di folder yang sama dengan file index.html ini dan beri nama "video.mp4".
  Video akan otomatis diputar saat puzzle hati berhasil disatukan!
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --cream:#FBF5F1;
    --paper:#FDF8F5;
    --pink:#F7DEE0;
    --pink-deep:#F0B9C2;
    --red:#C6273B;
    --red-deep:#9E1B2C;
    --ink:#2B2320;
    --muted:#8a7a74;
    --shadow: 0 20px 50px rgba(198,39,59,0.18);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:#E7C6C9;
    color:var(--ink);
    font-family:'Jost',sans-serif;
    font-weight:300;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  .stage{ max-width:460px; margin:0 auto; background:var(--cream); position:relative; overflow:hidden; box-shadow:0 0 120px rgba(0,0,0,0.35); }

  .eyebrow{ font-family:'Playfair Display',serif; font-style:italic; font-weight:500; font-size:14px; color:var(--red); text-align:center; }
  .serif{ font-family:'Playfair Display',serif; }

  section{ position:relative; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 26px; overflow:hidden; }

  /* decorative scattered icons */
  .deco{ position:absolute; opacity:0.9; pointer-events:none; user-select:none; }
  .deco.star{ color:var(--red); font-size:18px; }
  .deco.spark{ color:var(--pink-deep); font-size:14px; }
  .deco.bang{ color:var(--red); font-size:26px; }

  /* grid paper texture for lyric panels */
  .grid-bg{
    background-image:
      linear-gradient(rgba(198,39,59,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(198,39,59,0.06) 1px, transparent 1px);
    background-size: 28px 28px;
    background-color: var(--paper);
  }

  /* ============ HERO / PUZZLE ============ */
  #hero{ background: linear-gradient(180deg, var(--pink) 0%, var(--cream) 70%); }
  .hero-top{ text-align:center; margin-bottom:8px; }
  .hero-top .tag{ font-size:11px; letter-spacing:0.28em; text-transform:uppercase; color:var(--muted); }
  .hero-top h1{ font-family:'Playfair Display',serif; font-weight:700; font-size:26px; color:var(--red-deep);
    background:linear-gradient(180deg, transparent 60%, var(--pink-deep) 60%); display:inline-block; padding:0 6px; margin-top:6px; }
  .hero-top .sub{ font-family:'Playfair Display',serif; font-style:italic; font-size:16px; margin-top:14px; color:var(--ink); }

  .puzzle-wrap{ position:relative; width:300px; height:300px; margin:26px auto 10px; touch-action:none; }
  .slot-guide{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:150px; height:150px; pointer-events:none; }
  .piece{
    position:absolute; width:150px; height:150px; cursor:grab;
    filter:drop-shadow(0 8px 16px rgba(198,39,59,0.35));
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
    will-change: transform, left, top;
    -webkit-transform-style: preserve-3d;
    -webkit-backface-visibility: hidden;
  }
  .piece.locked{ cursor:default; filter:drop-shadow(0 2px 5px rgba(198,39,59,0.18)); }
  .piece svg, .slot-guide{ 
    width:100%; height:100%; display:block; pointer-events:none; 
    shape-rendering: geometricPrecision;
    text-rendering: optimizeLegibility;
  }
  .hint{ text-align:center; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin-top:14px; }
  .hint.done{ color:var(--red); }

  /* flower burst overlay */
  #burst{ position:fixed; inset:0; pointer-events:none; z-index:60; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  #burst span{ position:absolute; font-size:26px; opacity:0; will-change:transform, opacity; }

  /* ============ LYRIC PANELS ============ */
  .lyric{ text-align:center; }
  .lyric p{ font-family:'Playfair Display',serif; font-style:italic; font-weight:500; font-size:30px; line-height:1.4; color:var(--ink); opacity:0; transform:translateY(18px); transition:opacity 1s ease, transform 1s ease; max-width:320px; }
  .lyric.in p{ opacity:1; transform:translateY(0); }

  /* ============ GALLERY ============ */
  #gallery{ background:var(--pink); min-height:auto; padding:80px 22px; }
  #gallery .eyebrow{ margin-bottom:6px; }
  #gallery h2{ font-family:'Playfair Display',serif; font-weight:700; font-size:22px; text-align:center; color:var(--red-deep); margin-bottom:34px; }
  .polaroids{ position:relative; display:flex; justify-content:center; align-items:flex-end; gap:0; height:280px; }
  .polaroid{ background:#fff; padding:10px 10px 34px; box-shadow:var(--shadow); position:absolute; width:150px; }
  .polaroid img{ width:100%; height:170px; object-fit:cover; display:block; }
  .polaroid figcaption{ font-family:'Playfair Display',serif; font-style:italic; text-align:center; margin-top:8px; font-size:14px; color:var(--red); }
  .p1{ left:6%; top:26px; transform:rotate(-9deg); z-index:1; }
  .p2{ left:50%; top:0; transform:translateX(-50%) rotate(2deg); z-index:2; width:165px; }
  .p2 img{ height:190px; }
  .p3{ right:4%; top:34px; transform:rotate(8deg); z-index:1; }

  /* ============ CLOSING (assembled heart) ============ */
  #closing{ background:linear-gradient(180deg, var(--cream), var(--pink)); text-align:center; }
  .heart-final{ width:130px; height:130px; margin:0 auto 22px; }
  #closing h2{ font-family:'Playfair Display',serif; font-weight:700; font-size:24px; color:var(--red-deep); }
  #closing p{ font-family:'Playfair Display',serif; font-style:italic; font-size:15px; color:var(--ink); margin-top:10px; max-width:280px; }
  .replay-btn{ margin-top:26px; border:none; cursor:pointer; background:var(--red); color:#fff; font-family:'Jost',sans-serif; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; padding:13px 26px; border-radius:100px; box-shadow:0 12px 24px rgba(198,39,59,0.3); }

  /* ============ FULL SCREEN VIDEO DISPLAY (100% LAYAR FULL) ============ */
  #videoContainer {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.7s ease;
    overflow: hidden;
  }
  #videoContainer.active {
    opacity: 1;
    pointer-events: auto;
  }
  #loveVideo {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    background: #000;
    display: block;
    image-rendering: -webkit-optimize-contrast;
    image-rendering: crisp-edges;
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
    will-change: transform;
  }
  .sound-hint {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #fff;
    font-family: 'Jost', sans-serif;
    font-size: 12px;
    letter-spacing: 0.12em;
    padding: 10px 22px;
    border-radius: 100px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
    z-index: 1000;
  }
  .sound-hint.show {
    opacity: 1;
  }

  /* iPhone 13 & Mobile Device Optimizations */
  @media (max-width: 480px) {
    .stage {
      max-width: 100vw;
    }
    .video-modal {
      padding: max(16px, env(safe-area-inset-top, 16px)) 16px max(16px, env(safe-area-inset-bottom, 16px));
    }
    .video-card {
      max-width: 92vw;
      padding: 18px 14px;
    }
    .video-wrapper video {
      max-height: 52vh;
    }
  }

  ::selection{ background:var(--red); color:#fff; }
</style>
</head>
<body>
<div class="stage">

  <!-- ============== HERO + PUZZLE ============== -->
  <section id="hero">
    <span class="deco star" style="top:8%;left:10%;">★</span>
    <span class="deco spark" style="top:14%;right:14%;">✦</span>
    <span class="deco bang" style="bottom:10%;left:8%;">!</span>
    <span class="deco spark" style="bottom:16%;right:10%;">✦</span>

    <div class="hero-top">
      <p class="tag">happy</p>
      <h1>National Girlfriend Day</h1>
      <p class="sub">widyaaa sayangg ❤️</p>
    </div>

    <div class="puzzle-wrap" id="puzzleWrap">
      <svg class="slot-guide" viewBox="0 0 200 200">
        <path d="M 100 172 C 90 162, 24 116, 16 76 C 8 36, 54 16, 84 42 C 93 50, 97 56, 100 62 C 103 56, 107 50, 116 42 C 146 16, 192 36, 184 76 C 176 116, 110 162, 100 172 Z" fill="none" stroke="rgba(198,39,59,0.38)" stroke-width="2.5" stroke-dasharray="8 6"/>
      </svg>
      <!-- 4 pieces generated by JS -->
    </div>

    <p class="hint" id="hint">drag each piece into place</p>
  </section>

  <!-- flower burst overlay, spawned by JS -->
  <div id="burst"></div>

</div>

<!-- FULL SCREEN VIDEO DISPLAY (100% FULL LAYAR NO BACKGROUND) -->
<div id="videoContainer">
  <video id="loveVideo" playsinline autoplay loop muted preload="auto">
    <source src="vidio.mp4" type="video/mp4">
    <source src="video.mp4" type="video/mp4">
    <source src="video.mov" type="video/quicktime">
    <source src="video.webm" type="video/webm">
    Browser kamu tidak mendukung pemutaran video.
  </video>
  <div class="sound-hint" id="soundHint">🔊 Sentuh layar untuk membunyikan suara</div>
</div>

<script>
  /* =========================================================
     LIRIK — ganti sesuai kata-kata / lagu pilihan kalian
     (array ini cuma dipakai untuk referensi timing musik opsional)
  ========================================================= */
  const LYRICS = [
    "you look so beautiful today",
    "and I love this view",
    "we fell in love in october",
    "that's why",
    "looking at the way you smile",
    "admiring you from right beside me"
  ];

  /* =========================================================
     PUZZLE HATI — drag 4 potongan ke posisi yang benar
  ========================================================= */
  const wrap = document.getElementById('puzzleWrap');
  const wrapRect = () => wrap.getBoundingClientRect();

  // 4 interlocking jigsaw pieces (with tabs and indents / lengkungan puzzle)
  const pieceDefs = [
    { 
      key: 'tl', 
      clip: 'M 0 0 L 100 0 L 100 70 C 97 70, 96 74, 102 77 C 114 81, 114 89, 102 93 C 96 95, 97 98, 100 98 L 100 100 L 76 100 C 76 97, 72 96, 69 102 C 65 114, 55 114, 51 102 C 48 96, 44 97, 44 100 L 0 100 Z',
      scatter: [-60, -35, -14]
    },
    { 
      key: 'tr', 
      clip: 'M 100 0 L 200 0 L 200 100 L 162 100 C 162 97, 158 96, 155 102 C 151 88, 141 88, 137 102 C 134 96, 130 97, 130 100 L 100 100 L 100 98 C 97 98, 96 95, 102 93 C 114 89, 114 81, 102 77 C 96 74, 97 70, 100 70 Z',
      scatter: [210, -25, 12]
    },
    { 
      key: 'bl', 
      clip: 'M 0 100 L 44 100 C 44 97, 48 96, 51 102 C 55 114, 65 114, 69 102 C 72 96, 76 97, 76 100 L 100 100 L 100 114 C 97 114, 96 118, 98 121 C 86 125, 86 133, 98 137 C 96 139, 97 142, 100 142 L 100 200 L 0 200 Z',
      scatter: [-70, 180, 10]
    },
    { 
      key: 'br', 
      clip: 'M 100 100 L 130 100 C 130 97, 134 96, 137 102 C 141 88, 151 88, 155 102 C 158 96, 162 97, 162 100 L 200 100 L 200 200 L 100 200 L 100 142 C 97 142, 96 139, 98 137 C 86 133, 86 125, 98 121 C 96 118, 97 114, 100 114 Z',
      scatter: [215, 185, -12]
    }
  ];

  const HEART_PATH = 'M 100 172 C 90 162, 24 116, 16 76 C 8 36, 54 16, 84 42 C 93 50, 97 56, 100 62 C 103 56, 107 50, 116 42 C 146 16, 192 36, 184 76 C 176 116, 110 162, 100 172 Z';

  let locked = 0;
  const pieces = [];

  pieceDefs.forEach((q, i) => {
    const piece = document.createElement('div');
    piece.className = 'piece';
    piece.innerHTML = `
      <svg viewBox="0 0 200 200">
        <defs>
          <clipPath id="piece-clip-${q.key}"><path d="${q.clip}"/></clipPath>
        </defs>
        <!-- Pure Red Heart Fragment cut with organic jigsaw curves -->
        <path d="${HEART_PATH}" fill="#C6273B" clip-path="url(#piece-clip-${q.key})"/>
      </svg>
    `;
    wrap.appendChild(piece);

    const [sx, sy, rot] = q.scatter;
    piece.style.left = sx + 'px';
    piece.style.top = sy + 'px';
    piece.style.transform = `rotate(${rot}deg)`;
    piece.dataset.rot = rot;

    // All pieces assemble to targetX=75, targetY=75 inside the 300x300 container
    const targetX = 75;
    const targetY = 75;

    let dragging = false, offX = 0, offY = 0;

    piece.addEventListener('pointerdown', (e) => {
      if (piece.classList.contains('locked')) return;
      dragging = true;
      piece.setPointerCapture(e.pointerId);
      const r = piece.getBoundingClientRect();
      offX = e.clientX - r.left;
      offY = e.clientY - r.top;
      piece.style.transition = 'none';
      piece.style.zIndex = 10;
    });

    piece.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const wr = wrapRect();
      let nx = e.clientX - wr.left - offX;
      let ny = e.clientY - wr.top - offY;
      piece.style.left = nx + 'px';
      piece.style.top = ny + 'px';
    });

    function endDrag() {
      if (!dragging) return;
      dragging = false;
      const curX = parseFloat(piece.style.left);
      const curY = parseFloat(piece.style.top);
      const dist = Math.hypot(curX - targetX, curY - targetY);
      piece.style.transition = 'left .3s ease, top .3s ease, transform .3s ease';
      if (dist < 35) {
        piece.style.left = targetX + 'px';
        piece.style.top = targetY + 'px';
        piece.style.transform = 'rotate(0deg)';
        piece.classList.add('locked');
        locked++;
        if (locked === 4) onSolved();
      } else {
        piece.style.left = sx + 'px';
        piece.style.top = sy + 'px';
        piece.style.transform = `rotate(${rot}deg)`;
      }
    }
    piece.addEventListener('pointerup', endDrag);
    piece.addEventListener('pointercancel', endDrag);

    pieces.push({ piece, sx, sy, rot });
  });

  function resetPuzzle() {
    locked = 0;
    document.getElementById('hint').textContent = 'drag each piece into place';
    document.getElementById('hint').classList.remove('done');
    pieces.forEach(p => {
      p.piece.classList.remove('locked');
      p.piece.style.transition = 'left .5s ease, top .5s ease, transform .5s ease';
      p.piece.style.left = p.sx + 'px';
      p.piece.style.top = p.sy + 'px';
      p.piece.style.transform = `rotate(${p.rot}deg)`;
    });
  }

  function onSolved() {
    document.getElementById('hint').textContent = '♥ together again ♥';
    document.getElementById('hint').classList.add('done');
    flowerBurst();
    
    // Play video popup after the flower burst spam completes
    setTimeout(() => {
      playVideo();
    }, 1200);
  }

  document.getElementById('replayBtn')?.addEventListener('click', () => {
    resetPuzzle();
    document.getElementById('hero')?.scrollIntoView({ behavior:'smooth' });
  });

  /* =========================================================
     LEDAKAN BUNGA LILY (SPAM FOTO LILY.JPG DARI TENGAH PUZZLE)
  ========================================================= */
  function flowerBurst() {
    const host = document.getElementById('burst');
    if (!host) return;
    host.innerHTML = '';
    
    const pWrap = document.getElementById('puzzleWrap');
    const pRect = pWrap ? pWrap.getBoundingClientRect() : null;

    // Center of puzzle heart on screen
    const originX = pRect ? (pRect.left + pRect.width / 2) : (window.innerWidth / 2);
    const originY = pRect ? (pRect.top + pRect.height / 2) : (window.innerHeight * 0.45);

    // Spam 4 staggered waves of lily.jpg flower explosion
    const waves = [0, 100, 220, 350];
    waves.forEach((delay) => {
      setTimeout(() => {
        const countPerWave = 22;
        for (let i = 0; i < countPerWave; i++) {
          const el = document.createElement('img');
          el.src = 'lily.jpg';
          el.alt = 'bunga lily';
          
          const size = 26 + Math.random() * 32;
          const angle = Math.random() * Math.PI * 2;
          const dist = 70 + Math.random() * 260;
          const tx = Math.cos(angle) * dist;
          const ty = Math.sin(angle) * dist;
          const rot = (Math.random() - 0.5) * 640;

          el.style.position = 'fixed';
          el.style.left = originX + 'px';
          el.style.top = originY + 'px';
          el.style.width = size + 'px';
          el.style.height = size + 'px';
          el.style.objectFit = 'cover';
          el.style.borderRadius = '50%';
          el.style.boxShadow = '0 6px 16px rgba(198,39,59,0.35)';
          el.style.border = '2px solid #FDF8F5';
          el.style.pointerEvents = 'none';
          el.style.zIndex = '99';

          el.animate([
            { transform: 'translate(-50%, -50%) scale(0.2) rotate(0deg)', opacity: 1 },
            { transform: `translate(calc(-50% + ${tx * 0.5}px), calc(-50% + ${ty * 0.5}px)) scale(1.3) rotate(${rot * 0.5}deg)`, opacity: 1, offset: 0.4 },
            { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0.5) rotate(${rot}deg)`, opacity: 0 }
          ], { 
            duration: 1300 + Math.random() * 600, 
            easing: 'cubic-bezier(0.15, 0.85, 0.35, 1.2)' 
          });

          host.appendChild(el);
          setTimeout(() => el.remove(), 2100);
        }
      }, delay);
    });
  }

  /* =========================================================
     KONTROL VIDEO FULL SCREEN (Auto Play 100% Layar Full)
  ========================================================= */
  const videoContainer = document.getElementById('videoContainer');
  const loveVideo = document.getElementById('loveVideo');

  function playVideo() {
    if (!videoContainer || !loveVideo) return;
    
    videoContainer.classList.add('active');
    loveVideo.loop = true;
    loveVideo.currentTime = 0;
    try { loveVideo.load(); } catch(e){}

    // iOS Safari requirement: set muted = true before play() to guarantee 100% autoplay
    loveVideo.muted = true;
    const playPromise = loveVideo.play();
    
    if (playPromise !== undefined) {
      playPromise.then(() => {
        // Attempt unmuting audio immediately
        loveVideo.muted = false;
      }).catch(() => {
        // If unmuting is blocked without explicit tap gesture, show hint
        loveVideo.muted = true;
        loveVideo.play().catch(() => {});
        const hint = document.getElementById('soundHint');
        if (hint) {
          hint.classList.add('show');
          setTimeout(() => hint.classList.remove('show'), 4000);
        }
      });
    }
  }

  // Triple-layer looping system for instant seamless video loop on completion
  if (loveVideo) {
    loveVideo.loop = true;
    loveVideo.setAttribute('loop', 'true');

    loveVideo.addEventListener('ended', function() {
      this.currentTime = 0;
      this.play().catch(function() {});
    });

    loveVideo.addEventListener('timeupdate', function() {
      if (this.duration && this.currentTime >= (this.duration - 0.15)) {
        this.currentTime = 0;
        this.play().catch(function() {});
      }
    });
  }

  // Touch/Click anywhere on the full screen video to unmute audio if browser muted it
  if (videoContainer) {
    videoContainer.addEventListener('pointerdown', () => {
      if (loveVideo) {
        if (loveVideo.muted) {
          loveVideo.muted = false;
          loveVideo.play().catch(() => {});
          document.getElementById('soundHint')?.classList.remove('show');
        }
      }
    });
  }
</script>
</body>
</html>
